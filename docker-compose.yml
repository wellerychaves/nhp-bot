services:
  discord_bot:
    build: .
    container_name: nhp-bot
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: UTC
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bun"]
      interval: 30s
      timeout: 5s
      retries: 3